name: Create Automatic Release

on:
  push:
    tags:
      - '*.*.*' # Triggers only when pushing tags that match the pattern 1.0.0, 2.1.3, etc.

permissions:
  contents: write # Needed to create the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to extract changelog correctly
          
      - name: Extract Release Notes from CHANGELOG
        id: extract_changelog
        uses: mathieudutour/github-tag-action@v6.2 # Helper to handle versions
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true # We only want it to extract info, not create a new tag since we push it manually
          
      - name: Parse specific version from CHANGELOGs
        id: get_notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          
          echo "## 🇬🇧 English" > release_notes.md
          
          # Extract from English CHANGELOG
          awk -v ver="$VERSION" '
            $0 ~ "## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md >> release_notes.md
          
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🇪🇸 Español" >> release_notes.md
          
          # Extract from Spanish CHANGELOG
          awk -v ver="$VERSION" '
            $0 ~ "## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG-es.md >> release_notes.md
          
          echo "Extracted bilingual notes for version $VERSION"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          name: Discord Embed Creator ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
